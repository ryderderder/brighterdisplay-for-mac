name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-and-build:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Toolchain
        run: swiftc --version
      - name: Core safety and interaction tests
        run: ./scripts/test.sh
      - name: Build and verify arm64 app
        run: ./scripts/build.sh
      - name: Validate source manifest and shell scripts
        run: |
          while IFS= read -r path; do test -f "$path" || exit 1; done < .release-files
          for script in scripts/*.sh; do sh -n "$script"; done
          plutil -lint Resources/Info.plist
